<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Safety Incident Log</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Safety Incident Log</h1>
        
        <div class="form-section">
            <h2>Report New Incident</h2>
            <form id="incidentForm">
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" required>
                </div>
                
                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" name="description" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="severity">Severity:</label>
                    <select id="severity" name="severity" required>
                        <option value="">Select Severity</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                
                <button type="submit">Submit Incident</button>
            </form>
        </div>

        <div class="incidents-section">
            <h2>Reported Incidents</h2>
            <div id="incidentsList"></div>
        </div>
    </div>
    <footer>
        <div class="footer-container">
            <p>Created by Prem Aman</p>
            <div class="contact-info">
                <a href="mailto:amanprem374@gmail.com" class="email-link">
                    <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="Email">
                    amanprem374@gmail.com
                </a>
            </div>
            <div class="social-links">
                <a href="https://github.com/premaman10" target="_blank">
                    <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub">
                </a>
                <a href="https://linkedin.com/in/prem-aman" target="_blank">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn">
                </a>
            </div>
        </div>
    </footer>
      

    <script>
        // Fetch and display incidents
        async function fetchIncidents() {
            try {
                const response = await fetch('/api/incidents');
                const incidents = await response.json();
                const incidentsList = document.getElementById('incidentsList');
                incidentsList.innerHTML = incidents.map(incident => `
                    <div class="incident-card severity-${incident.severity.toLowerCase()}">
                        <h3>${incident.title}</h3>
                        <p>${incident.description}</p>
                        <div class="incident-meta">
                            <span class="severity">Severity: ${incident.severity}</span>
                            <span class="date">Reported: ${new Date(incident.reported_at).toLocaleDateString()}</span>
                        </div>
                        <button onclick="deleteIncident('${incident._id}')" class="delete-btn">Delete</button>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error fetching incidents:', error);
            }
        }

        // Submit new incident
        document.getElementById('incidentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                severity: document.getElementById('severity').value
            };

            try {
                const response = await fetch('/api/incidents', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error);
                }

                document.getElementById('incidentForm').reset();
                fetchIncidents();
            } catch (error) {
                alert('Error submitting incident: ' + error.message);
            }
        });

        // Delete incident
        async function deleteIncident(id) {
            if (!confirm('Are you sure you want to delete this incident?')) return;
            
            try {
                const response = await fetch(`/api/incidents/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete incident');
                }

                fetchIncidents();
            } catch (error) {
                alert('Error deleting incident: ' + error.message);
            }
        }

        // Initial load
        fetchIncidents();
    </script>
</body>
</html>
